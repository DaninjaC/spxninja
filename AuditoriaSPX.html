<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auditoria Visual SPX - Modo Entregador</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body { font-family: sans-serif; background: #111; color: #fff; margin: 0; padding: 20px; text-align: center; }
        h1 { color: #39FF14; margin-top: 0; font-size: 24px;}
        .btn-upload { display: inline-block; background: #39FF14; color: #000; padding: 15px 30px; font-weight: bold; font-size: 18px; border-radius: 8px; cursor: pointer; margin-bottom: 20px; }
        input[type="file"] { display: none; }
        
        .grid-mapas { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; width: 100%; }
        .col-mapa { flex: 1; min-width: 300px; max-width: 800px; background: #222; padding: 15px; border-radius: 10px; border: 1px solid #444; }
        
        .titulo-mapa { font-size: 20px; font-weight: bold; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 2px solid #444; }
        .titulo-padrao { color: #ff4444; }
        .titulo-otimizado { color: #39FF14; }
        
        .mapa-container { height: 500px; width: 100%; background: #000; border-radius: 8px; }
        .stop-label { background: rgba(0,0,0,0.8); color: #fff; border: 1px solid #fff; font-weight: bold; padding: 2px 4px; border-radius: 3px; font-size: 10px; }
        
        #loading-msg { display: none; color: #FFCC00; font-weight: bold; font-size: 18px; margin-bottom: 20px; }
    </style>
</head>
<body>

    <h1>🗺️ SPX Ninja - Auditoria Visual (A Lógica do Entregador)</h1>
    <label class="btn-upload" id="btn-label">
        📂 CARREGAR PLANILHA
        <input type="file" id="fileInput" accept=".xlsx, .xls, .csv">
    </label>
    
    <div id="loading-msg">⏳ Aplicando Raio de Caminhada nas esquinas...</div>

    <div class="grid-mapas" id="area-mapas" style="display:none;">
        <div class="col-mapa">
            <div class="titulo-mapa titulo-padrao" id="info-padrao">▶️ PADRÃO SHOPEE</div>
            <div id="mapa-padrao" class="mapa-container"></div>
        </div>
        <div class="col-mapa">
            <div class="titulo-mapa titulo-otimizado" id="info-otimizado">🚀 OTIMIZADA (Lógica Humana)</div>
            <div id="mapa-otimizado" class="mapa-container"></div>
        </div>
    </div>

    <script>
        let mapPadrao = null, mapOtimizado = null;
        let layerPadrao = L.layerGroup(), layerOtimizado = L.layerGroup();

        function iniciarMapas() {
            if (!mapPadrao) {
                mapPadrao = L.map('mapa-padrao').setView([-23.61, -46.57], 14);
                L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(mapPadrao);
                layerPadrao.addTo(mapPadrao);
            }
            if (!mapOtimizado) {
                mapOtimizado = L.map('mapa-otimizado').setView([-23.61, -46.57], 14);
                L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(mapOtimizado);
                layerOtimizado.addTo(mapOtimizado);
            }
        }

        // Distância Pura (Linha Reta / Pássaro)
        function dist(la1, lo1, la2, lo2) {
            const R = 6371000;
            const dLat = (la2-la1) * Math.PI/180;
            const dLon = (lo2-lo1) * Math.PI/180;
            const a = Math.sin(dLat/2)**2 + Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dLon/2)**2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function formatarDistancia(metros) {
            return metros > 1000 ? (metros/1000).toFixed(2) + " km" : Math.round(metros) + " m";
        }

        function extrairRuaPadrao(enderecoBruto) {
            if (!enderecoBruto) return "DESCONHECIDO";
            let limpo = enderecoBruto.toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
            let match = limpo.match(/^([^,0-9-]+)/);
            if (match) limpo = match[1].trim();
            limpo = limpo.replace(/^R\.\s|^R\s/, "RUA ");
            limpo = limpo.replace(/^AV\.\s|^AV\s/, "AVENIDA ");
            return limpo.trim();
        }

        // --- A MÁGICA FINAL: LÓGICA DO ENTREGADOR HUMANO ---
        function otimizarPorLogicaDoEntregador(rotaOriginal) {
            let rotaOtimizada = [];
            let pendentes = [...rotaOriginal];
            
            let atual = pendentes.shift(); 
            rotaOtimizada.push(atual);

            while (pendentes.length > 0) {
                let melhorIdx = -1;
                let menorCusto = Infinity;
                let ruaAtual = atual.ruaPadrao;

                for (let i = 0; i < pendentes.length; i++) {
                    let candidato = pendentes[i];
                    let dReta = dist(atual.lat, atual.lon, candidato.lat, candidato.lon);
                    let custo = dReta;

                    // 1. REGRA SUPREMA: O MODO A PÉ (Até 100 metros)
                    // Se a próxima entrega estiver muito perto, o custo despenca.
                    // O algoritmo agrupa agora, assumindo que você para na esquina e vai andando!
                    if (dReta <= 100) {
                        custo = dReta * 0.01; // Desconto gigante (Prioridade Máxima)
                    } 
                    // 2. REGRA DO CARRO: LIMPAR A RUA
                    // Se não tiver ninguém perto pra ir a pé, continua limpando a rua de carro.
                    else if (ruaAtual === candidato.ruaPadrao && ruaAtual !== "DESCONHECIDO") {
                        custo = dReta * 0.3; // Desconto bom para manter na via
                    }

                    if (custo < menorCusto) {
                        menorCusto = custo;
                        melhorIdx = i;
                    }
                }

                rotaOtimizada.push(pendentes[melhorIdx]);
                atual = pendentes[melhorIdx];
                pendentes.splice(melhorIdx, 1);
            }

            return rotaOtimizada;
        }

        // --- DESENHO LIMPO (TRACEJADO RETO) ---
        function plotarLigacaoDireta(camada, mapa, rota, corLinha) {
            camada.clearLayers();
            let coordenadas = [];
            let distanciaRealDaSequencia = 0;

            for (let i = 0; i < rota.length; i++) {
                let p = rota[i];
                coordenadas.push([p.lat, p.lon]);

                if (i < rota.length - 1) {
                    distanciaRealDaSequencia += dist(p.lat, p.lon, rota[i+1].lat, rota[i+1].lon);
                }

                let corPino = (i === 0) ? '#007AFF' : '#555'; 
                L.circleMarker([p.lat, p.lon], { radius: 5, color: '#fff', fillColor: corPino, fillOpacity: 1, weight: 1 })
                    .bindTooltip(i === 0 ? "INÍCIO (Stop " + p.stop + ")" : "Stop " + p.stop, { permanent: true, direction: 'right', className: 'stop-label', offset: [5, 0] })
                    .addTo(camada);
            }

            // Desenha a linha reta para provar a ordem sem o GPS atrapalhar
            if (coordenadas.length > 0) {
                let polyline = L.polyline(coordenadas, { color: corLinha, weight: 3, opacity: 0.8 }).addTo(camada);
                mapa.fitBounds(polyline.getBounds(), { padding: [30, 30] });
            }

            return distanciaRealDaSequencia;
        }

        // --- INÍCIO DO PROCESSAMENTO ---
        document.getElementById('fileInput').addEventListener('change', function(e) {
            document.getElementById('btn-label').style.display = 'none';
            document.getElementById('loading-msg').style.display = 'block';
            document.getElementById('area-mapas').style.display = 'flex';
            iniciarMapas();

            const reader = new FileReader();
            
            reader.onload = function(evt) {
                const wb = XLSX.read(evt.target.result, { type: 'binary' });
                const dataRaw = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
                
                const json = dataRaw.map(row => {
                    const normalized = {};
                    for (let key in row) normalized[key.trim().toLowerCase()] = row[key];
                    return normalized;
                });

                const stopsUnicos = new Set();
                let rotaOriginal = json.filter(i => {
                        let s = i.stop || i.parada || i.sequence;
                        if (!s || isNaN(s) || stopsUnicos.has(s)) return false; 
                        stopsUnicos.add(s); return true;
                    })
                    .sort((a, b) => (a.stop || a.parada) - (b.stop || b.parada))
                    .map(i => {
                        return {
                            lat: parseFloat(String(i.latitude || i.lat).replace(',', '.')),
                            lon: parseFloat(String(i.longitude || i.lon || i.lng).replace(',', '.')),
                            ruaPadrao: extrairRuaPadrao(i["destination address"] || i.endereco),
                            stop: i.stop || i.parada || i.sequence
                        };
                    })
                    .filter(i => !isNaN(i.lat) && !isNaN(i.lon));

                if(rotaOriginal.length === 0) return alert("Planilha inválida.");

                // 1. APLICA A SUA LÓGICA DO MAPA (Esquinas a Pé + Carro na Rua)
                let rotaOtimizada = otimizarPorLogicaDoEntregador(rotaOriginal);

                // 2. DESENHA NA TELA
                setTimeout(() => {
                    mapPadrao.invalidateSize();
                    mapOtimizado.invalidateSize();

                    let distPadrao = plotarLigacaoDireta(layerPadrao, mapPadrao, rotaOriginal, '#ff4444');
                    let distOtimizada = plotarLigacaoDireta(layerOtimizado, mapOtimizado, rotaOtimizada, '#39FF14');

                    document.getElementById('loading-msg').style.display = 'none';
                    document.getElementById('btn-label').style.display = 'inline-block';

                    document.getElementById('info-padrao').innerHTML = `▶️ PADRÃO SHOPEE <br><small>KM Geométrico: ${formatarDistancia(distPadrao)}</small>`;
                    document.getElementById('info-otimizado').innerHTML = `🚀 OTIMIZADA SPX <br><small>KM Geométrico: ${formatarDistancia(distOtimizada)}</small>`;
                }, 300);
            };
            
            reader.readAsBinaryString(e.target.files[0]);
        });
    </script>
</body>
</html>
