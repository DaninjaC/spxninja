<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Teste - Rota Manual (Legenda Tática)</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background-color: #111; color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; touch-action: none;}
        
        #painel-topo { background: #222; padding: 15px; text-align: center; border-bottom: 2px solid #444; z-index: 1000; position: relative; }
        h2 { margin: 0 0 5px 0; color: #FFCC00; font-size: 18px;}
        p { margin: 0 0 10px 0; font-size: 12px; color: #aaa; }
        
        .btn-file { background: #39FF14; color: #000; padding: 10px 20px; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; display: inline-block; margin-bottom: 5px; width: 90%; max-width: 300px;}
        input[type="file"] { display: none; }

        .btn-desenho { background: #FF8C00; color: #000; padding: 10px 20px; border: none; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; transition: 0.3s; width: 90%; max-width: 300px; display: none; margin: 0 auto;}
        .btn-desenho.ativo { background: #dc3545; color: #fff; }
        
        #map-container { flex: 1; position: relative; width: 100%; height: 100%; }
        #map { width: 100%; height: 100%; background: #000; }
        
        #camada-desenho { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2000; display: none; cursor: crosshair; touch-action: none; }
        
        #painel-resultado { background: #000; padding: 15px; border-top: 2px solid #39FF14; display: flex; flex-direction: column; min-height: 80px; max-height: 150px; overflow-y: auto;}
        
        .header-resultado { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        #status-texto { font-size: 12px; color: #aaa; }
        
        .botoes-acao { display: flex; gap: 8px; }
        .btn-action { color: #fff; border: none; padding: 6px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; }
        #btn-desfazer-vaga { display: none; background: #007AFF; }
        #btn-desfazer { background: #ff4444; }

        #ordem-selecionada { font-size: 16px; color: #39FF14; font-weight: bold; letter-spacing: 1px; word-wrap: break-word; line-height: 1.5; text-align: center;}
        
        .stop-label { background: rgba(0,0,0,0.8); color: #fff; border: 1px solid #777; font-weight: bold; padding: 2px 4px; border-radius: 3px; font-size: 12px; }
        .vaga-label { background: #007AFF; color: #fff; border: 1px solid #fff; font-weight: bold; padding: 2px 4px; border-radius: 3px; font-size: 12px; }
        
        .leaflet-tile-container { filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%); }
    </style>
</head>
<body>

    <div id="painel-topo">
        <h2>Teste de Rota Manual</h2>
        <p id="instrucao">Carregue a planilha. Dica: <b>Um toque rápido</b> na rua abre a opção de criar Vaga.</p>
        
        <label class="btn-file" id="btn-carregar">
            📦 CARREGAR PLANILHA SHOPEE
            <input type="file" id="fileInput" accept=".xlsx, .xls, .csv">
        </label>

        <button id="btn-toggle" class="btn-desenho" onclick="toggleModoDesenho()">✏️ ATIVAR MODO DESENHO</button>
    </div>

    <div id="map-container">
        <div id="map"></div>
        <div id="camada-desenho"></div>
    </div>

    <div id="painel-resultado">
        <div class="header-resultado">
            <div id="status-texto">Ordem capturada:</div>
            <div class="botoes-acao">
                <button id="btn-desfazer-vaga" class="btn-action" onclick="desfazerUltimaVaga()">🚙 DESFAZER VAGA</button>
                <button id="btn-desfazer" class="btn-action" onclick="desfazerUltimoRisco()">✏️ DESFAZER RISCO</button>
            </div>
        </div>
        <div id="ordem-selecionada">Nenhuma parada selecionada.</div>
    </div>

    <script>
        const map = L.map('map', { zoomControl: false }).setView([-14.235, -51.925], 4);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        let marcadores = [];
        let modoDesenho = false;
        let desenhando = false;
        let vagaCount = 0;
        
        let startX = 0, startY = 0;
        let mudouDeLugar = false;
        let houveCapturaNesteCiclo = false;

        let linhaDedo = L.polyline([], { color: '#FFCC00', weight: 5, opacity: 0.8, dashArray: '10, 10' }).addTo(map);
        let rotaReal = L.polyline([], { color: '#007AFF', weight: 6, opacity: 0.9 }).addTo(map);
        
        let sequenciaSelecionada = [];
        let historicoDeRoteamento = [[]]; 
        let vagasCriadas = []; 
        
        const camadaVidro = document.getElementById('camada-desenho');

        // ====== FUNÇÃO PARA RENDERIZAR A LEGENDA COM OS PACOTES DA VAGA ======
        function renderizarOrdem() {
            if (sequenciaSelecionada.length === 0) return "Nenhuma parada capturada.";

            let textoMapeado = sequenciaSelecionada.map(id => {
                if (id.startsWith("Vaga")) {
                    let vagaObj = vagasCriadas.find(v => v.marker.spxId === id);
                    if (vagaObj && vagaObj.clientesSugados.length > 0) {
                        let pacotes = vagaObj.clientesSugados.map(m => m.spxId).join(", ");
                        return `${id} (${pacotes})`;
                    }
                }
                return id;
            });

            return textoMapeado.join(" ➔ ");
        }

        // ====== LEITURA DA PLANILHA ======
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const reader = new FileReader();
            document.getElementById('btn-carregar').style.display = 'none';
            document.getElementById('instrucao').innerText = "Lendo coordenadas...";

            reader.onload = function(evt) {
                try {
                    const wb = XLSX.read(evt.target.result, { type: 'binary' });
                    const dataRaw = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
                    
                    const json = dataRaw.map(row => {
                        const normalized = {};
                        for (let key in row) normalized[key.trim().toLowerCase()] = row[key];
                        return normalized;
                    });

                    const stopsUnicos = new Map();
                    let extraCount = 1;

                    marcadores.forEach(m => map.removeLayer(m));
                    marcadores = [];

                    json.forEach(i => {
                        let lat = parseFloat(String(i.latitude || i.lat).replace(',', '.'));
                        let lon = parseFloat(String(i.longitude || i.lon || i.lng).replace(',', '.'));
                        let stopRaw = i.stop || i.parada || i.sequence;
                        
                        if (isNaN(lat) || isNaN(lon)) return; 

                        let stopLabel = "";
                        if (!stopRaw || String(stopRaw).trim() === '-' || isNaN(parseInt(stopRaw))) {
                            stopLabel = "E" + extraCount; 
                            extraCount++;
                        } else {
                            stopLabel = parseInt(stopRaw).toString();
                        }

                        if (!stopsUnicos.has(stopLabel)) {
                            stopsUnicos.set(stopLabel, { id: stopLabel, lat: lat, lon: lon });
                        }
                    });

                    if (stopsUnicos.size === 0) throw new Error("Nenhuma coordenada válida encontrada.");

                    let boundsCoords = [];

                    stopsUnicos.forEach(p => {
                        let cor = p.id.startsWith("E") ? '#FF8C00' : '#555'; 
                        
                        let marker = L.circleMarker([p.lat, p.lon], { 
                            radius: 8, color: '#fff', fillColor: cor, fillOpacity: 1, weight: 2 
                        })
                        .bindTooltip(p.id, { permanent: true, direction: 'top', className: 'stop-label', offset: [0, -5] })
                        .addTo(map);
                        
                        marker.spxId = p.id;
                        marker.spxLatLng = L.latLng(p.lat, p.lon);
                        marker.corOriginal = cor;
                        marker.isGrouped = false; 
                        
                        marcadores.push(marker);
                        boundsCoords.push([p.lat, p.lon]);
                    });

                    map.fitBounds(boundsCoords, { padding: [30, 30] });

                    document.getElementById('instrucao').innerText = "Arraste para ligar os pinos, ou dê um toque na rua vazia para criar uma Vaga.";
                    document.getElementById('btn-toggle').style.display = 'inline-block';

                } catch (err) {
                    alert("Erro ao ler planilha: " + err.message);
                    document.getElementById('btn-carregar').style.display = 'inline-block';
                }
            };
            reader.readAsBinaryString(e.target.files[0]);
        });

        // ====== CONTROLE DE DESENHO ======
        function toggleModoDesenho() {
            const btn = document.getElementById('btn-toggle');
            modoDesenho = !modoDesenho;

            if (modoDesenho) {
                btn.innerHTML = "❌ DESATIVAR MODO DESENHO";
                btn.classList.add('ativo');
                camadaVidro.style.display = 'block'; 
            } else {
                btn.innerHTML = "✏️ ATIVAR MODO DESENHO";
                btn.classList.remove('ativo');
                camadaVidro.style.display = 'none'; 
            }
        }

        function getLatLngFromEvent(e) {
            const rect = camadaVidro.getBoundingClientRect();
            const x = (e.clientX || e.touches[0].clientX) - rect.left;
            const y = (e.clientY || e.touches[0].clientY) - rect.top;
            return map.containerPointToLatLng([x, y]);
        }

        // ====== CRIAR VAGA ======
        function projetarECriarVaga(latlng) {
            document.getElementById('status-texto').innerText = "⏳ Alinhando vaga com a rua mais próxima...";
            
            fetch(`https://router.project-osrm.org/nearest/v1/driving/${latlng.lng},${latlng.lat}`)
                .then(res => res.json())
                .then(data => {
                    let snappedLatLng = latlng;
                    
                    if (data.code === 'Ok' && data.waypoints && data.waypoints.length > 0) {
                        let loc = data.waypoints[0].location;
                        snappedLatLng = L.latLng(loc[1], loc[0]); 
                    }

                    vagaCount++;
                    let vId = "Vaga " + vagaCount;
                    
                    let markerVaga = L.circleMarker(snappedLatLng, { 
                        radius: 10, color: '#fff', fillColor: '#007AFF', fillOpacity: 1, weight: 3 
                    })
                    .bindTooltip(vId, { permanent: true, direction: 'top', className: 'vaga-label', offset: [0, -5] })
                    .addTo(map);

                    markerVaga.spxId = vId;
                    markerVaga.spxLatLng = snappedLatLng;
                    markerVaga.corOriginal = '#007AFF';
                    markerVaga.isGrouped = false; 
                    
                    marcadores.push(markerVaga);

                    let novaVagaObj = {
                        marker: markerVaga,
                        linhasConectoras: [],
                        clientesSugados: []
                    };

                    marcadores.forEach(m => {
                        if (m !== markerVaga && !m.isGrouped && !sequenciaSelecionada.includes(m.spxId) && !m.spxId.startsWith("Vaga")) {
                            let dist = map.distance(snappedLatLng, m.spxLatLng);
                            if (dist <= 70) {
                                m.isGrouped = true; 
                                m.setStyle({ fillColor: '#007AFF', color: '#333', weight: 1, dashArray: '2, 2' });
                                
                                let linha = L.polyline([snappedLatLng, m.spxLatLng], {color: '#007AFF', weight: 2, dashArray: '4, 4', opacity: 0.6}).addTo(map);
                                
                                novaVagaObj.linhasConectoras.push(linha);
                                novaVagaObj.clientesSugados.push(m);
                            }
                        }
                    });

                    vagasCriadas.push(novaVagaObj);
                    document.getElementById('btn-desfazer-vaga').style.display = 'inline-block';
                    document.getElementById('status-texto').innerText = "✅ " + vId + " fixada no asfalto!";

                    if(navigator.vibrate) navigator.vibrate([100, 50, 100]);
                    
                    // Atualiza a legenda para mostrar os pacotes se a vaga já foi inserida na rota, ou só a lista normal
                    document.getElementById('ordem-selecionada').innerHTML = renderizarOrdem();
                    atualizarTelaERota();
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById('status-texto').innerText = "⚠️ Erro ao validar rua. Vaga não criada.";
                });
        }

        // ====== REMOVER ÚLTIMA VAGA ======
        function desfazerUltimaVaga() {
            if (vagasCriadas.length > 0) {
                let ultimaVaga = vagasCriadas.pop();
                
                map.removeLayer(ultimaVaga.marker);
                marcadores = marcadores.filter(m => m !== ultimaVaga.marker);
                sequenciaSelecionada = sequenciaSelecionada.filter(id => id !== ultimaVaga.marker.spxId);
                
                ultimaVaga.linhasConectoras.forEach(l => map.removeLayer(l));
                
                ultimaVaga.clientesSugados.forEach(m => {
                    m.isGrouped = false;
                    m.setStyle({ fillColor: m.corOriginal, color: '#fff', weight: 2, dashArray: '' });
                });
                
                vagaCount--;
                if (vagasCriadas.length === 0) {
                    document.getElementById('btn-desfazer-vaga').style.display = 'none';
                }

                document.getElementById('status-texto').innerText = "🚙 Última Vaga desfeita com sucesso.";
                document.getElementById('ordem-selecionada').innerHTML = renderizarOrdem();
                atualizarTelaERota();
            }
        }

        // ====== VERIFICA CAPTURA ======
        function verificarCaptura(latlng) {
            let capturouAlgo = false;
            marcadores.forEach(m => {
                if (!sequenciaSelecionada.includes(m.spxId) && !m.isGrouped) {
                    let distanciaMetros = map.distance(latlng, m.spxLatLng);
                    if (distanciaMetros < 12) {
                        sequenciaSelecionada.push(m.spxId); 
                        m.setStyle({ fillColor: '#39FF14', color: '#000', weight: 3 }); 
                        
                        document.getElementById('ordem-selecionada').innerHTML = renderizarOrdem();
                        
                        capturouAlgo = true;
                        houveCapturaNesteCiclo = true;
                    }
                }
            });
            return capturouAlgo;
        }

        // ====== EVENTOS DO TOQUE ======
        camadaVidro.addEventListener('pointerdown', function(e) {
            desenhando = true;
            mudouDeLugar = false;
            houveCapturaNesteCiclo = false;
            
            startX = e.clientX;
            startY = e.clientY;
            
            let latlng = getLatLngFromEvent(e);
            linhaDedo.setLatLngs([]); 
            linhaDedo.addLatLng(latlng);
            
            verificarCaptura(latlng);
        });

        camadaVidro.addEventListener('pointermove', function(e) {
            if (!desenhando) return;

            let currentX = e.clientX;
            let currentY = e.clientY;
            let distPixels = Math.sqrt((currentX - startX)**2 + (currentY - startY)**2);
            
            if (distPixels > 8) {
                mudouDeLugar = true;
            }

            let latlng = getLatLngFromEvent(e);
            linhaDedo.addLatLng(latlng);
            verificarCaptura(latlng);
        });

        camadaVidro.addEventListener('pointerup', async function(e) {
            if (!desenhando) return;
            desenhando = false;
            linhaDedo.setLatLngs([]); 
            
            let latlng = getLatLngFromEvent(e);

            if (!mudouDeLugar && !houveCapturaNesteCiclo) {
                let proximaVaga = vagaCount + 1;
                if (confirm(`Deseja criar a "Vaga ${proximaVaga}" neste ponto da rua?`)) {
                    projetarECriarVaga(latlng);
                    return; 
                }
            }

            let ultimaSalva = historicoDeRoteamento[historicoDeRoteamento.length - 1];
            if (sequenciaSelecionada.length > ultimaSalva.length) {
                historicoDeRoteamento.push([...sequenciaSelecionada]);
            }
            atualizarTelaERota();
        });

        camadaVidro.addEventListener('pointercancel', () => desenhando = false);
        camadaVidro.addEventListener('pointerout', () => desenhando = false);

        // ====== BOTÃO DESFAZER RISCO ======
        function desfazerUltimoRisco() {
            if (historicoDeRoteamento.length > 1) {
                historicoDeRoteamento.pop(); 
                sequenciaSelecionada = [...historicoDeRoteamento[historicoDeRoteamento.length - 1]];
                
                marcadores.forEach(m => {
                    if(!m.isGrouped) { 
                        m.setStyle({ fillColor: m.corOriginal, color: '#fff', weight: 2 });
                    }
                });
                
                marcadores.forEach(m => {
                    if (sequenciaSelecionada.includes(m.spxId)) {
                        m.setStyle({ fillColor: '#39FF14', color: '#000', weight: 3 });
                    }
                });
                
                document.getElementById('ordem-selecionada').innerHTML = renderizarOrdem();
                atualizarTelaERota();
            }
        }

        // ====== CONVERSÃO DE LINHA EM ASFALTO ======
        async function atualizarTelaERota() {
            if (sequenciaSelecionada.length === 0) {
                document.getElementById('ordem-selecionada').innerText = "Nenhuma parada capturada.";
                document.getElementById('status-texto').innerText = "Ordem capturada:";
                rotaReal.setLatLngs([]);
            } 
            else if (sequenciaSelecionada.length === 1) {
                // Preserva o texto da Vaga com parênteses caso o único item selecionado seja uma Vaga
                document.getElementById('ordem-selecionada').innerHTML = `<b>${renderizarOrdem()}</b> (Toque no próximo)`;
                document.getElementById('status-texto').innerText = "Ordem capturada:";
                rotaReal.setLatLngs([]);
            } 
            else {
                document.getElementById('status-texto').innerText = "⏳ Convertendo traço em asfalto...";
                
                try {
                    let coordsURL = sequenciaSelecionada.map(id => {
                        let m = marcadores.find(x => x.spxId === id);
                        return m.spxLatLng.lng + ',' + m.spxLatLng.lat;
                    }).join(';');

                    let url = `https://router.project-osrm.org/route/v1/driving/${coordsURL}?overview=full&geometries=geojson`;
                    let res = await fetch(url);
                    let data = await res.json();

                    if (data.routes && data.routes[0]) {
                        let latLngsReais = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
                        rotaReal.setLatLngs(latLngsReais); 
                        
                        document.getElementById('status-texto').innerText = "✅ Rota Manual Confirmada:";
                        document.getElementById('ordem-selecionada').innerHTML = renderizarOrdem();
                    }
                } catch (err) {
                    document.getElementById('status-texto').innerText = "⚠️ Sem internet. Ordem de paradas salva:";
                    document.getElementById('ordem-selecionada').innerHTML = renderizarOrdem();
                }
            }
        }
    </script>
</body>
</html>
